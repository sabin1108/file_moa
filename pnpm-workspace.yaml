packages:
  - apps/*
  - packages/*

saveExact: true

# shortcut: upstream stable still pins minimatch 10, remove after its patched stable release.
overrides:
  minimatch@10.2.6: 11.0.8

allowBuilds:
  '@prisma/engines': true
  prisma: true
  unrs-resolver: false
  tesseract.js: false
  # Browser inference uses onnxruntime-web; do not download unused native runtimes in CI.
  onnxruntime-node: false
  # The SDK uses prebuilt packages; protobuf metadata and optional Sharp source builds are unnecessary.
  protobufjs: false
  sharp: false

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.17'
  - '@better-auth/drizzle-adapter@1.7.17'
  - '@better-auth/kysely-adapter@1.7.17'
  - '@better-auth/memory-adapter@1.7.17'
  - '@better-auth/mongo-adapter@1.7.17'
  - '@better-auth/prisma-adapter@1.7.17'
  - '@better-auth/telemetry@1.7.17'
  - better-auth@1.7.17
