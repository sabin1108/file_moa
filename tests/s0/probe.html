<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S0 로컬 보관 검증</title>
<body><main>
<h1>S0 로컬 보관 검증 도구</h1>
<p>개발용 도구입니다. 외부 전송과 AI 호출은 없습니다. 자료 폴더는 읽기 전용으로 검사합니다.</p>
<p>저장은 원본 자료가 없는 별도 테스트 폴더를 선택하세요. 선택 폴더 안에 새로운 moa-s0-… 폴더와 합성 기록을 만듭니다.</p>
<button id="source">자료 폴더 읽기 전용 확인</button>
<button id="target">별도 테스트 폴더 선택 후 저장 검증</button>
<button id="restore">저장 폴더 연결 복원</button>
<button id="simulate">테스트 기록에 저장 중단 예시 만들기</button>
<button id="recovery-preview">복구할 정상 버전 확인</button>
<button id="recover" disabled>확인한 이력을 별도 폴더에 복구</button>
<pre id="output" role="status" aria-live="polite">준비됨</pre>
</main><script type="module" src="/probe.mjs"></script></body></html>
